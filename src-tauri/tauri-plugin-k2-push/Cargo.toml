[package]
name = "tauri-plugin-k2-push"
version = "0.1.0"
description = "K2 Companion push notifications (APNs/FCM) — dormant-safe local plugin"
authors = ["Alakazam Labs"]
edition = "2021"
# `links` is required for Tauri mobile plugins: it's how the app build
# locates this plugin's android/ + ios/ native projects.
links = "tauri-plugin-k2-push"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", features = ["wry"] }
