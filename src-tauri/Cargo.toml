[package]
name = "k2so-companion"
version = "4.1.2"
description = "Mobile companion for K2 agent orchestrator"
authors = ["Alakazam Labs"]
edition = "2021"

[lib]
name = "k2so_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# >= 2.11.5 REQUIRED: 2.10.x's iOS plugin-IPC response handler held the
# PENDING_PLUGIN_CALLS mutex across WKURLSchemeTask.didReceiveResponse
# (which waits on the main runloop) — any concurrent invoke arriving on
# the main thread deadlocked the app (the /servers ↔ /login freeze).
tauri = { version = "2.11.5", features = [] }
tauri-plugin-store = "2"
tauri-plugin-k2-push = { path = "tauri-plugin-k2-push" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP's TLS engine, per platform (Rosson 2026-10-24, export compliance):
# iOS uses Apple's own TLS (Security.framework via native-tls), so the
# app's encryption is only what iOS provides and the App Store
# "exempt" declaration is accurate. Everywhere else (Android) keeps the
# plugin's default, rustls. Keep these two in step on plugin upgrades;
# scripts/release.sh refuses an iOS build that links rustls/ring.
[target.'cfg(target_os = "ios")'.dependencies.tauri-plugin-http]
version = "2"
default-features = false
features = ["native-tls", "http2", "charset", "macos-system-configuration", "cookies"]

[target.'cfg(not(target_os = "ios"))'.dependencies]
tauri-plugin-http = "2"

# objc2 is Apple-only (used behind #[cfg(target_os = "ios")] in lib.rs);
# an unconditional dep breaks Android cross-compilation.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.4"

[profile.release]
strip = true
lto = true
codegen-units = 1

# iOS 27 requires UIApplicationSceneManifest (Info.ios.plist). That makes
# tao take its scene path. 0.35.3 then UAF-crashes in
# configurationForConnectingSceneSession (Retained::as_ptr). Upstream
# tauri-apps/tao#1245 (still versioned 0.35.3) uses autorelease_ptr.
# Tauri 2.11.5 pins tao ^0.35, so 0.36+ cannot be pulled. Drop this
# patch when tauri allows tao >= 0.36.
[patch.crates-io]
tao = { git = "https://github.com/tauri-apps/tao", rev = "f2163508104413ef0609178dcebdd5803b496211" }
