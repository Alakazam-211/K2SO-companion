[package]
name = "k2so-companion"
version = "4.2.1"
description = "Mobile companion for K2 agent orchestrator"
authors = ["Alakazam Labs"]
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "k2so_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# >= 2.11.5 REQUIRED: 2.10.x's iOS plugin-IPC response handler held the
# PENDING_PLUGIN_CALLS mutex across WKURLSchemeTask.didReceiveResponse
# (which waits on the main runloop) — any concurrent invoke arriving on
# the main thread deadlocked the app (the /servers ↔ /login freeze).
tauri = { version = "2.11.5", features = [] }
tauri-plugin-store = "2"
tauri-plugin-k2-push = { path = "tauri-plugin-k2-push" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP's TLS engine, per platform (Rosson 2026-10-24, export compliance):
# iOS uses Apple's own TLS (Security.framework via native-tls), so the
# app's encryption is only what iOS provides and the App Store
# "exempt" declaration is accurate. Everywhere else (Android) keeps the
# plugin's default, rustls. Keep these two in step on plugin upgrades;
# scripts/release.sh refuses an iOS build that links rustls/ring.
[target.'cfg(target_os = "ios")'.dependencies.tauri-plugin-http]
version = "2"
default-features = false
features = ["native-tls", "http2", "charset", "macos-system-configuration", "cookies"]

[target.'cfg(not(target_os = "ios"))'.dependencies]
tauri-plugin-http = "2"

# objc2 is Apple-only (used behind #[cfg(target_os = "ios")] in lib.rs);
# an unconditional dep breaks Android cross-compilation.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.4"

# Voice rooms (4.2.0, iOS first; Android is Jeremie's): Sew's native voice
# plugin over sew-call-client and K2's kessel-audio. Not on crates.io yet:
# the [patch.crates-io] rows below point at Sew's public mirror. `mobile` is
# the pure-Rust DTLS/SRTP that phones need; the build stops without it.
# macOS too, only so `cargo test` runs src/voice.rs's tests on the Mac; the
# plugin is registered on iOS alone.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
base64 = "0.22"
# `builtin-ring-provider`: rustls's ring provider (a default feature, off with
# default-features = false; without it TLS refuses with no_crypto_provider).
# `video-core`: remote video for the picture in picture (native sinks);
# `video`: kessel-video's backends, so VP8 arrives decoded (a CVPixelBuffer).
tauri-plugin-sew-voice = { version = "0.5", default-features = false, features = ["tauri", "audio", "mobile", "builtin-ring-provider", "video-core", "video"] }
sew-call-client = { version = "0.5", default-features = false, features = ["mobile"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1

# Debug and simulator builds: the media crates run hot (VP8 decode is about
# 45 ms a frame at opt-level 0, about 1 ms at 3; K2 11-06). TestFlight and the
# App Store link the release profile anyway.
[profile.dev.package.vp8-decoder]
opt-level = 3
[profile.dev.package.vp8-encoder]
opt-level = 3
[profile.dev.package.kessel-video]
opt-level = 3
[profile.dev.package.sew-call-client]
opt-level = 3
[profile.dev.package.str0m]
opt-level = 3

# iOS 27 requires UIApplicationSceneManifest (Info.ios.plist). That makes
# tao take its scene path. 0.35.3 then UAF-crashes in
# configurationForConnectingSceneSession (Retained::as_ptr). Upstream
# tauri-apps/tao#1245 (still versioned 0.35.3) uses autorelease_ptr.
# Tauri 2.11.5 pins tao ^0.35, so 0.36+ cannot be pulled. Drop this
# patch when tauri allows tao >= 0.36.
[patch.crates-io]
tao = { git = "https://github.com/tauri-apps/tao", rev = "f2163508104413ef0609178dcebdd5803b496211" }
# Connection reuse: upstream builds a new HTTP client per request. See
# vendor/README.md. Drop when upstream reuses clients.
tauri-plugin-http = { path = "vendor/tauri-plugin-http" }
# Gardens: widget frames must not reach the Tauri bridge (contract §10). See
# vendor/README.md. Keep in step with the wry that tauri pins.
wry = { path = "vendor/wry" }
# Voice: Sew's crates, the str0m and dimpl forks they need, and kessel-audio
# with the phone backends (K2 aad16f76b); kessel-video 0.1.1 is from
# crates.io. Sew 0.8.2 from the public mirror (github.com/Alakazam-211/sew-crates
# 29beb541) with its str0m rev 7faf99d1. Move all of these together.
sew-proto = { git = "https://github.com/Alakazam-211/sew-crates", rev = "29beb54159512588b00b1ce074c40da486f095c7" }
sew-lkproto = { git = "https://github.com/Alakazam-211/sew-crates", rev = "29beb54159512588b00b1ce074c40da486f095c7" }
sew-mls-crypto = { git = "https://github.com/Alakazam-211/sew-crates", rev = "29beb54159512588b00b1ce074c40da486f095c7" }
sew-e2ee = { git = "https://github.com/Alakazam-211/sew-crates", rev = "29beb54159512588b00b1ce074c40da486f095c7" }
sew-lk-compat = { git = "https://github.com/Alakazam-211/sew-crates", rev = "29beb54159512588b00b1ce074c40da486f095c7" }
sew-call-client = { git = "https://github.com/Alakazam-211/sew-crates", rev = "29beb54159512588b00b1ce074c40da486f095c7" }
tauri-plugin-sew-voice = { git = "https://github.com/Alakazam-211/sew-crates", rev = "29beb54159512588b00b1ce074c40da486f095c7" }
str0m = { git = "https://github.com/Alakazam-211/str0m", rev = "7faf99d17f34292b5c9f72e67f3d0332cd67c122" }
str0m-proto = { git = "https://github.com/Alakazam-211/str0m", rev = "7faf99d17f34292b5c9f72e67f3d0332cd67c122" }
is = { git = "https://github.com/Alakazam-211/str0m", rev = "7faf99d17f34292b5c9f72e67f3d0332cd67c122" }
str0m-aws-lc-rs = { git = "https://github.com/Alakazam-211/str0m", rev = "7faf99d17f34292b5c9f72e67f3d0332cd67c122" }
dimpl = { git = "https://github.com/Alakazam-211/dimpl", rev = "a3481943e8e3fa270990e7c05a27d015cfbe4d77" }
kessel-audio = { git = "https://github.com/Alakazam-211/K2", rev = "aad16f76b8768ae090d3060033d473e87c736be4" }
