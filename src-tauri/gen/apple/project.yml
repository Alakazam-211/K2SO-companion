name: k2so-companion
options:
  bundleIdPrefix: dev.k2.companion
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: K2
      PRODUCT_BUNDLE_IDENTIFIER: com.alakazamlabs.k2so.companion
      DEVELOPMENT_TEAM: 36B8R93HXV
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  k2so-companion_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: k2so-companion_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: k2so-companion_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          # MUST stay true. tao 0.35.3 only registers the scene delegate
          # when this is true. false = solid black screen on iOS 26 and 27,
          # verified 2026-09-29 (e24b6bc FAIL). iPad second window is an
          # accepted tradeoff; if it becomes a problem, handle the second
          # scene — do not flip this flag.
          # Every `tauri ios build` rewrites k2so-companion_iOS/Info.plist
          # and STRIPS this comment. That absence is EXPECTED, not tampering.
          # Durable copies: this file and src-tauri/Info.ios.plist.
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: TaoSceneDelegate
        UILaunchStoryboardName: LaunchScreen
        # App is all dark: force dark appearance (keyboard included).
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 4.2.2
        CFBundleVersion: "202611092038"
        # Communication Notifications: the app declares the intent the
        # Notification Service Extension donates. Durable copy also in
        # src-tauri/Info.ios.plist (tauri merges it on every build).
        NSUserActivityTypes: [INSendMessageIntent]
        # Silent `{kind:"badge"}` pushes update the app-icon badge in the
        # background; `audio` keeps a voice-room call going. Durable copy
        # also in src-tauri/Info.ios.plist.
        UIBackgroundModes: [remote-notification, audio, voip]
        # Composer attach menu: camera (capture input) and the sound of a
        # recorded video. Durable copy also in src-tauri/Info.ios.plist.
        NSCameraUsageDescription: K2 uses the camera so people in a voice room can see you when you turn your camera on, so you can attach a photo or video to a message, and to scan the pairing QR code from your computer.
        NSMicrophoneUsageDescription: K2 uses the microphone for voice rooms, and to record sound when you attach a video to a message.
        ITSAppUsesNonExemptEncryption: false
        # Pair links (K2 0.46.4): k2companion://pair?server=<host>#<code>.
        # Durable copy also in src-tauri/Info.ios.plist.
        CFBundleURLTypes:
          - CFBundleURLName: com.alakazamlabs.k2so.companion.pair
            CFBundleURLSchemes: [k2companion]
    # Entitlements are two hand-kept, committed files (no `entitlements:`
    # key: XcodeGen would force one file onto every config):
    #   k2so-companion_iOS.entitlements        release (aps production)
    #   k2so-companion_iOS.debug.entitlements  debug (aps development)
    # Both carry Communication Notifications, the App Group
    # group.com.alakazamlabs.k2so.companion and Associated Domains
    # applinks:*.k2.dev (pair links; the AASA is on the k2.dev apex). release.sh only flips
    # aps-environment development -> production in the release file.
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        CODE_SIGN_ENTITLEMENTS: k2so-companion_iOS/k2so-companion_iOS.entitlements
      groups: [app]
      # Manual signing with the ASC-created profiles (the App Group and
      # Communication Notifications capabilities are not in Xcode's
      # automatic team profile, and this Mac has no Xcode account).
      # Debug: development profile, whose aps-environment is
      # "development", so it signs with the .debug entitlements copy.
      # Release (archive): the App Store profile; release.sh re-signs at
      # export with the same profile names.
      configs:
        debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Development
          PROVISIONING_PROFILE_SPECIFIER: K2 Companion Dev
          CODE_SIGN_ENTITLEMENTS: k2so-companion_iOS/k2so-companion_iOS.debug.entitlements
        release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: K2 Companion App Store Push
    dependencies:
      - target: K2NotificationService
        embed: true
      - target: K2Broadcast
        embed: true
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  # Notification Service Extension (iOS Communication Notifications):
  # turns a Thread push into a message notification with the agent's
  # avatar. Reads avatars from the App Group the app's k2-push plugin
  # fills. Manual signing like the app: "K2 Companion NSE Dev" (debug),
  # "K2 Companion NSE App Store" (release archive + release.sh export).
  K2NotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: K2NotificationService
      # The app-icon badge store, ONE source shared with the app's k2-push
      # plugin (Swift package). Foundation-only.
      - path: ../../tauri-plugin-k2-push/ios/Sources/K2BadgeStore.swift
      # Sealed pushes (K2 0.46.3 push-e2e-v1): the same sources as the plugin.
      - path: ../../tauri-plugin-k2-push/ios/Sources/K2PushCrypto.swift
      - path: ../../tauri-plugin-k2-push/ios/Sources/K2PushKeys.swift
      - path: ../../tauri-plugin-k2-push/ios/Sources/K2PushReplay.swift
      - path: ../../tauri-plugin-k2-push/ios/Sources/K2PushSealed.swift
      - path: ../../tauri-plugin-k2-push/ios/Sources/K2PushInbox.swift
    info:
      path: K2NotificationService/Info.plist
      properties:
        CFBundleDisplayName: K2 Notification Service
        CFBundleShortVersionString: 4.2.2
        CFBundleVersion: "202611092038"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: K2NotificationService/K2NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.alakazamlabs.k2so.companion
    settings:
      base:
        PRODUCT_NAME: K2NotificationService
        PRODUCT_BUNDLE_IDENTIFIER: com.alakazamlabs.k2so.companion.NotificationService
        DEVELOPMENT_TEAM: 36B8R93HXV
        CODE_SIGN_STYLE: Manual
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: true
        ENABLE_BITCODE: false
      configs:
        debug:
          CODE_SIGN_IDENTITY: Apple Development
          PROVISIONING_PROFILE_SPECIFIER: K2 Companion NSE Dev
        release:
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: K2 Companion NSE App Store
    dependencies:
      - sdk: Intents.framework
      - sdk: UserNotifications.framework
      - sdk: UIKit.framework
  # Broadcast Upload Extension (the iPhone screen share in a voice-room
  # call; iOS captures the screen only in one): ReplayKit's screen frames go
  # raw into Sew's ring (kessel-frame-ring) in the App Group's container,
  # which the app's voice plugin arms once a call is connected; the app
  # encodes and encrypts. Started from iOS's broadcast picker (the call
  # bar's Share screen), never from the webview. Links kessel-frame-ring's
  # C surface as a static library, built by the "Build Frame Ring" phase
  # (src-tauri/broadcast-ring/build-ios.sh) for the SDK being built.
  # Manual signing like the NSE: "K2 Companion Broadcast Dev" (debug, device
  # builds), "K2 Companion Broadcast App Store" (release archive + release.sh
  # export), both for App ID com.alakazamlabs.k2so.companion.Broadcast with
  # the App Group. Simulator builds sign locally, with no profile.
  K2Broadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: K2Broadcast
      # The extension's frame rules, ONE source with the macOS check
      # (tauri-plugin-k2-push/ios: `swift run BroadcastCheck`).
      - path: ../../tauri-plugin-k2-push/ios/BroadcastFrames/K2BroadcastFrames.swift
    info:
      path: K2Broadcast/Info.plist
      properties:
        CFBundleDisplayName: K2
        CFBundleShortVersionString: 4.2.2
        CFBundleVersion: "202611092038"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: K2Broadcast/K2Broadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.alakazamlabs.k2so.companion
    settings:
      base:
        PRODUCT_NAME: K2Broadcast
        PRODUCT_BUNDLE_IDENTIFIER: com.alakazamlabs.k2so.companion.Broadcast
        DEVELOPMENT_TEAM: 36B8R93HXV
        CODE_SIGN_STYLE: Manual
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: true
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        EXCLUDED_ARCHS: x86_64
        SWIFT_OBJC_BRIDGING_HEADER: K2Broadcast/K2Broadcast-Bridging-Header.h
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(inherited) $(PROJECT_DIR)/../../broadcast-ring/target/aarch64-apple-ios/release
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(inherited) $(PROJECT_DIR)/../../broadcast-ring/target/aarch64-apple-ios-sim/release
        OTHER_LDFLAGS: $(inherited) -lk2_broadcast_ring
        # The phase runs cargo outside Xcode's sandbox (rustup, the registry).
        ENABLE_USER_SCRIPT_SANDBOXING: false
        # Simulator: signed to run locally, no profile needed.
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
        PROVISIONING_PROFILE_SPECIFIER[sdk=iphonesimulator*]: ""
      configs:
        debug:
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Development
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: K2 Companion Broadcast Dev
        release:
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: K2 Companion Broadcast App Store
    preBuildScripts:
      - script: '"${PROJECT_DIR}/../../broadcast-ring/build-ios.sh"'
        name: Build Frame Ring
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(PROJECT_DIR)/../../broadcast-ring/target/aarch64-apple-ios/release/libk2_broadcast_ring.a
          - $(PROJECT_DIR)/../../broadcast-ring/target/aarch64-apple-ios-sim/release/libk2_broadcast_ring.a
    dependencies:
      - sdk: ReplayKit.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
